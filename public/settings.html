<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Reg-Starter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="setup-body">
    <div class="setup-page">
      <header class="setup-header">
        <div>
          <h1>Settings</h1>
          <p class="subtitle">Edit your local configuration, export a backup, or reset setup.</p>
        </div>
        <div class="setup-header-actions">
          <a href="/" class="btn btn-ghost">Back to dashboard</a>
        </div>
      </header>

      <p class="setup-meta" id="configPathHint"></p>

      <section class="setup-panel">
        <div id="manualEditorHost"></div>
        <div id="reviewHost" class="hidden"></div>
      </section>

      <section class="setup-panel settings-actions-panel">
        <div class="setup-actions spread">
          <div class="action-group">
            <button type="button" class="btn btn-primary" id="saveSettingsBtn">Save changes</button>
            <button type="button" class="btn btn-ghost" id="exportConfigBtn">Export JSON</button>
          </div>
          <button type="button" class="btn btn-danger" id="resetConfigBtn">Reset setup</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="config-editor.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
